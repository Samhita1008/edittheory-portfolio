<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background: #090b12; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <rect width="1000" height="600" fill="#090b12"/>
  
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0e111a" stroke="#22283a" stroke-width="1"/>
  <circle cx="68" cy="64" r="5" fill="#ef4444"/>
  <circle cx="86" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="104" cy="64" r="5" fill="#10b981"/>
  <text x="500" y="68" fill="#71717a" font-size="11" font-family="monospace" text-anchor="middle">RESTAURANT OUTREACH AI • STRUCTURED 8-POINT AUDIT REPORT</text>

  <!-- Left: 8-Point Audit Checklist Output -->
  <g transform="translate(80, 110)">
    <rect width="450" height="410" rx="10" fill="#121624" stroke="#252c40" stroke-width="1"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="16" fill="#38bdf8" font-size="11" font-family="monospace">TARGET: OSTERIA MORINI (NEW YORK)</text>
      <text x="0" y="38" fill="#ffffff" font-size="16" font-weight="700">8-Point Deterministic Inspection</text>
      
      <line x1="0" y1="52" x2="400" y2="52" stroke="#1f2638" stroke-width="1"/>

      <!-- 8 Checklist Items -->
      <g transform="translate(0, 75)" font-size="11" font-family="monospace">
        <text x="0" y="0" fill="#10b981">✓ 1. Domain Online: HTTP 200 (1.4s load)</text>
        <text x="0" y="24" fill="#10b981">✓ 2. Load Speed: Passed &lt; 2.5s threshold</text>
        <text x="0" y="48" fill="#10b981">✓ 3. Mobile Viewport: Responsive layout active</text>
        <text x="0" y="72" fill="#10b981">✓ 4. Menu Accessibility: Digital PDF / HTML found</text>
        <text x="0" y="96" fill="#ef4444">✕ 5. Online Reservation Widget: Missing / Broken embed</text>
        <text x="0" y="120" fill="#10b981">✓ 6. Contact &amp; Hours: Phone &amp; dinner hours visible</text>
        <text x="0" y="144" fill="#ef4444">✕ 7. Mobile UI CTA: High friction booking funnel</text>
        <text x="0" y="168" fill="#10b981">✓ 8. Console Logs: Zero critical JS fatal exceptions</text>
      </g>

      <line x1="0" y1="275" x2="400" y2="275" stroke="#1f2638" stroke-width="1"/>
      <text x="0" y="295" fill="#f59e0b" font-size="10" font-family="monospace">AUDIT CLASSIFICATION: HIGH-OPPORTUNITY LEAD</text>
      <text x="0" y="315" fill="#71717a" font-size="10">Rationale: Strong foot traffic &amp; menu presence, but missing direct online</text>
      <text x="0" y="330" fill="#71717a" font-size="10">reservation widget causes direct booking attrition.</text>
    </g>
  </g>

  <!-- Right: Generated Outreach Pitch -->
  <g transform="translate(560, 110)">
    <rect width="360" height="410" rx="10" fill="#0b0e17" stroke="#1f2434" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <text x="0" y="16" fill="#a1a1aa" font-size="11" font-family="monospace">GENERATED PITCH (GROQ LLAMA 3.3)</text>
      <line x1="0" y1="30" x2="320" y2="30" stroke="#1a2030" stroke-width="1"/>
      
      <text x="0" y="60" fill="#ffffff" font-size="12" font-weight="600">Subj: Quick note re: Osteria Morini's booking flow</text>
      <text x="0" y="90" fill="#71717a" font-size="11" leading="relaxed">Hi Team,</text>
      <text x="0" y="115" fill="#a1a1aa" font-size="11">I loved seeing your dinner menu updates.</text>
      <text x="0" y="140" fill="#a1a1aa" font-size="11">While browsing on mobile, I noticed your table</text>
      <text x="0" y="160" fill="#a1a1aa" font-size="11">reservation link directs guests to a phone call</text>
      <text x="0" y="180" fill="#a1a1aa" font-size="11">rather than an instant 1-click table lock.</text>
      
      <text x="0" y="210" fill="#a1a1aa" font-size="11">We built an automated booking engine that</text>
      <text x="0" y="230" fill="#a1a1aa" font-size="11">captures weekend dinner reservations 24/7.</text>

      <line x1="0" y1="260" x2="320" y2="260" stroke="#1a2030" stroke-width="1"/>
      <text x="0" y="285" fill="#10b981" font-size="10" font-family="monospace">SAFETY &amp; DEDUPLICATION</text>
      <text x="0" y="305" fill="#71717a" font-size="10">Lead Hash: #HASH-OM-NYC-4021</text>
      <text x="0" y="325" fill="#71717a" font-size="10">Scheduled within 15/hr safe delivery limit</text>
    </g>
  </g>
</svg>
