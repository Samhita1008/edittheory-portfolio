<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background: #080a11; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="g4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <pattern id="g4-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#171b29" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="1200" height="680" fill="url(#g4-bg)"/>
  <rect width="1200" height="680" fill="url(#g4-grid)" opacity="0.6"/>

  <!-- Architecture Header Banner -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#4fffb0" font-size="11" font-family="monospace" letter-spacing="2" font-weight="600">AGENT 04 • OUTREACH ENGINE ARCHITECTURE</text>
    <text x="0" y="28" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">Restaurant Outreach AI System: Production Hardened</text>
    <text x="0" y="50" fill="#71717a" font-size="13">Structured 8-Point Audit Engine ↔ Deduplication Shield ↔ Throttled Gmail &amp; Telegram Alerts</text>
  </g>

  <!-- Flow Connector Lines -->
  <g stroke="#262b3d" stroke-width="2" fill="none">
    <path d="M 270 260 L 330 260"/>
    <path d="M 580 260 L 640 260"/>
    <path d="M 890 260 L 950 260"/>
    <path d="M 455 340 L 455 430 L 510 430"/>
    <path d="M 765 340 L 765 430 L 810 430"/>
  </g>

  <!-- Stage 1: Ingestion & Standalone Template -->
  <g transform="translate(60, 180)">
    <rect width="210" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#4fffb0" font-size="10" font-family="monospace" font-weight="700">STAGE 01 • INGESTION</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">Client Sheet Onboarding</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Decoupled Credentials</text>
    <line x1="16" y1="80" x2="194" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• Standardized CSV/Sheet</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Standalone deploy prep</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Centralized config env</text>
  </g>

  <!-- Stage 2: 8-Point Audit Engine -->
  <g transform="translate(330, 180)">
    <rect width="250" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="700">STAGE 02 • AUDIT ENGINE</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">8-Point Website Inspection</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Deterministic Evaluation</text>
    <line x1="16" y1="80" x2="234" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• HTTP status &amp; load speed</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Mobile viewport &amp; menu</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Written audit rationale</text>
  </g>

  <!-- Stage 3: Exception Boundaries & Deduplication -->
  <g transform="translate(640, 180)">
    <rect width="250" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#f59e0b" font-size="10" font-family="monospace" font-weight="700">STAGE 03 • RELIABILITY</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">Deduplication Shield</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Idempotent Hashing</text>
    <line x1="16" y1="80" x2="234" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• DNS/timeout exception trap</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Site_Unreachable CRM flag</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Zero duplicate email sends</text>
  </g>

  <!-- Stage 4: Dispatch & Alerts -->
  <g transform="translate(950, 180)">
    <rect width="190" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#10b981" font-size="10" font-family="monospace" font-weight="700">STAGE 04 • DISPATCH</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">Safety Throttling</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Gmail API &amp; Telegram</text>
    <line x1="16" y1="80" x2="174" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• 15 emails/hr domain cap</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Human review block</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Real-time Telegram alert</text>
  </g>

  <!-- Sub Node 1: Groq LLM Pitch -->
  <g transform="translate(510, 390)">
    <rect width="230" height="90" rx="8" fill="#0a0d16" stroke="#1e2436" stroke-width="1"/>
    <text x="16" y="26" fill="#a855f7" font-size="10" font-family="monospace" font-weight="700">INFERENCE ENGINE</text>
    <text x="16" y="46" fill="#ffffff" font-size="13" font-weight="600">Groq Llama 3.3 Endpoint</text>
    <text x="16" y="68" fill="#71717a" font-size="10" font-family="monospace">Contextual pitch using audit facts</text>
  </g>

  <!-- Sub Node 2: Telegram Push -->
  <g transform="translate(810, 390)">
    <rect width="210" height="90" rx="8" fill="#0a0d16" stroke="#1e2436" stroke-width="1"/>
    <text x="16" y="26" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="700">INCOMING REPLY MONITOR</text>
    <text x="16" y="46" fill="#ffffff" font-size="13" font-weight="600">Telegram Bot Webhook</text>
    <text x="16" y="68" fill="#71717a" font-size="10" font-family="monospace">Instant mobile notification</text>
  </g>
</svg>
