<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background: #090b12; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <rect width="1000" height="600" fill="#090b12"/>
  
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0e111a" stroke="#22283a" stroke-width="1"/>
  <circle cx="68" cy="64" r="5" fill="#ef4444"/>
  <circle cx="86" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="104" cy="64" r="5" fill="#10b981"/>
  <text x="500" y="68" fill="#71717a" font-size="11" font-family="monospace" text-anchor="middle">RWA COMPLAINT &amp; VENDOR COORDINATION • TELEGRAM INTERACTION STREAM</text>

  <!-- Left: Telegram Resident & Secretary Interaction Mockup -->
  <g transform="translate(70, 105)">
    <rect width="400" height="425" rx="14" fill="#141926" stroke="#262f44" stroke-width="1.5"/>
    
    <!-- Telegram Header -->
    <rect width="400" height="50" rx="14" fill="#1b2336"/>
    <circle cx="28" cy="25" r="13" fill="#0088cc"/>
    <text x="50" y="22" fill="#ffffff" font-size="12" font-weight="600">Society Care Bot</text>
    <text x="50" y="37" fill="#38bdf8" font-size="10" font-family="monospace">bot • active webhook listener</text>

    <!-- Message 1: Resident Message (Outgoing from resident) -->
    <g transform="translate(16, 65)">
      <rect width="368" height="62" rx="10" fill="#1c2538" stroke="#283550" stroke-width="1"/>
      <text x="14" y="20" fill="#a1a1aa" font-size="10" font-family="monospace">Resident (Flat B-402):</text>
      <text x="14" y="42" fill="#ffffff" font-size="12">Water leakage in B-402 near bathroom ceiling.</text>
    </g>

    <!-- Message 2: Bot Reply to Resident -->
    <g transform="translate(16, 140)">
      <rect width="368" height="100" rx="10" fill="#162032" stroke="#263552" stroke-width="1"/>
      <text x="14" y="22" fill="#4fffb0" font-size="10" font-family="monospace" font-weight="700">✓ TICKET CREATED: #TKT-B402-108</text>
      <text x="14" y="44" fill="#e4e4e7" font-size="11">Classification: Plumbing (High Urgency)</text>
      <text x="14" y="64" fill="#94a3b8" font-size="11">Logged to Google Sheets CRM.</text>
      <text x="14" y="84" fill="#38bdf8" font-size="10" font-family="monospace">Draft routed to Secretary for dispatch approval.</text>
    </g>

    <!-- Message 3: Secretary Approval Prompt -->
    <g transform="translate(16, 255)">
      <rect width="368" height="150" rx="10" fill="#1a2233" stroke="#2d3b59" stroke-width="1"/>
      <text x="14" y="22" fill="#f59e0b" font-size="10" font-family="monospace" font-weight="700">SECRETARY APPROVAL REQUIRED</text>
      <text x="14" y="44" fill="#ffffff" font-size="12" font-weight="600">Drafted Vendor Note (Plumbing Specialist)</text>
      <text x="14" y="66" fill="#cbd5e1" font-size="11">"Hi Rajesh, water leak reported in B-402. Please inspect today."</text>
      
      <!-- Interactive Buttons -->
      <g transform="translate(14, 88)">
        <rect width="160" height="34" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
        <text x="80" y="22" fill="#4fffb0" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">✓ Approve &amp; Dispatch</text>

        <rect x="175" width="160" height="34" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
        <text x="255" y="22" fill="#f87171" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">✕ Edit / Reject</text>
      </g>
      <text x="14" y="140" fill="#71717a" font-size="9" font-family="monospace">Human gate: vendor message stays pending until approved</text>
    </g>
  </g>

  <!-- Right: Sheets CRM & Broadcast Log Mockup -->
  <g transform="translate(500, 105)">
    <!-- Top Table: Sheets CRM -->
    <rect width="430" height="230" rx="10" fill="#0c0f18" stroke="#1f2638" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <text x="0" y="14" fill="#a1a1aa" font-size="11" font-family="monospace">GOOGLE SHEETS TICKET CRM (LIVE SYNC)</text>
      <line x1="0" y1="28" x2="390" y2="28" stroke="#1a2030" stroke-width="1"/>

      <!-- Table Header -->
      <g transform="translate(0, 48)" font-size="10" font-family="monospace" fill="#71717a">
        <text x="0" y="0">TICKET</text>
        <text x="85" y="0">FLAT</text>
        <text x="140" y="0">CATEGORY</text>
        <text x="235" y="0">APPROVAL</text>
        <text x="325" y="0">STATUS</text>
      </g>
      <line x1="0" y1="56" x2="390" y2="56" stroke="#1f2638" stroke-width="1"/>

      <!-- Row 1 -->
      <g transform="translate(0, 78)" font-size="11" font-family="monospace">
        <text x="0" y="0" fill="#4fffb0">#108</text>
        <text x="85" y="0" fill="#e4e4e7">B-402</text>
        <text x="140" y="0" fill="#cbd5e1">Plumbing</text>
        <text x="235" y="0" fill="#f59e0b">Approved</text>
        <text x="325" y="0" fill="#38bdf8">Dispatched</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 108)" font-size="11" font-family="monospace">
        <text x="0" y="0" fill="#4fffb0">#107</text>
        <text x="85" y="0" fill="#e4e4e7">A-104</text>
        <text x="140" y="0" fill="#cbd5e1">Electrical</text>
        <text x="235" y="0" fill="#10b981">Approved</text>
        <text x="325" y="0" fill="#10b981">Resolved</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 138)" font-size="11" font-family="monospace">
        <text x="0" y="0" fill="#4fffb0">#106</text>
        <text x="85" y="0" fill="#e4e4e7">C-201</text>
        <text x="140" y="0" fill="#cbd5e1">Security</text>
        <text x="235" y="0" fill="#10b981">Approved</text>
        <text x="325" y="0" fill="#10b981">Resolved</text>
      </g>
    </g>

    <!-- Bottom Box: Broadcast Notices & Read Receipts -->
    <g transform="translate(0, 245)">
      <rect width="430" height="180" rx="10" fill="#0c0f18" stroke="#1f2638" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <text x="0" y="14" fill="#a1a1aa" font-size="11" font-family="monospace">BROADCAST NOTICES &amp; ACKNOWLEDGEMENT LOG</text>
        <line x1="0" y1="28" x2="390" y2="28" stroke="#1a2030" stroke-width="1"/>

        <text x="0" y="52" fill="#ffffff" font-size="12" font-weight="600">Secretary Notice Broadcast</text>
        <text x="0" y="74" fill="#cbd5e1" font-size="11">Draft written once, preview approved on Telegram,</text>
        <text x="0" y="92" fill="#cbd5e1" font-size="11">dispatched to all registered residents automatically.</text>

        <rect x="0" y="108" width="390" height="34" rx="6" fill="#162032" stroke="#25334d" stroke-width="1"/>
        <text x="14" y="130" fill="#4fffb0" font-size="10" font-family="monospace">Acknowledgements Log: Track who has read vs pending</text>
      </g>
    </g>
  </g>
</svg>
