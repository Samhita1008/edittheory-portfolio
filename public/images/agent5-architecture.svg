<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background: #080a11; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="g5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <pattern id="g5-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#171b29" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="1200" height="680" fill="url(#g5-bg)"/>
  <rect width="1200" height="680" fill="url(#g5-grid)" opacity="0.6"/>

  <!-- Architecture Header Banner -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#4fffb0" font-size="11" font-family="monospace" letter-spacing="2" font-weight="600">AGENT 05 • INBOX TRIAGE ARCHITECTURE</text>
    <text x="0" y="28" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">Email Summary Agent: Autonomous Background Daemon</text>
    <text x="0" y="50" fill="#71717a" font-size="13">Continuous Gmail Polling ↔ Groq LLM Action Extraction ↔ Instant Telegram Digest</text>
  </g>

  <!-- Flow Connector Lines -->
  <g stroke="#262b3d" stroke-width="2" fill="none">
    <path d="M 280 270 L 370 270"/>
    <path d="M 620 270 L 710 270"/>
    <path d="M 960 270 L 1040 270"/>
  </g>

  <!-- Stage 1: Polling Daemon -->
  <g transform="translate(60, 190)">
    <rect width="220" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#4fffb0" font-size="10" font-family="monospace" font-weight="700">NODE 01 • INGESTION</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">Gmail API Poller</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Automated Cron Daemon</text>
    <line x1="16" y1="80" x2="204" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• 24/7 background interval</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• OAuth token auto-refresh</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Unread priority thread scan</text>
  </g>

  <!-- Stage 2: Groq Action Extraction -->
  <g transform="translate(370, 190)">
    <rect width="250" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#a855f7" font-size="10" font-family="monospace" font-weight="700">NODE 02 • INFERENCE</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">Groq LLM Engine</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Sub-Second Action Extraction</text>
    <line x1="16" y1="80" x2="234" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• Intent classification</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Urgency &amp; deadline detection</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Structured action summary</text>
  </g>

  <!-- Stage 3: Alert Formatting -->
  <g transform="translate(710, 190)">
    <rect width="250" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="700">NODE 03 • FORMATTING</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">Digest Synthesizer</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Markdown Digest Generator</text>
    <line x1="16" y1="80" x2="234" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• Noise filtering (newsletters)</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Priority hierarchy tagging</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• One-tap response deep links</text>
  </g>

  <!-- Stage 4: Telegram Mobile Push -->
  <g transform="translate(1040, 190)">
    <rect width="100" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="12" y="28" fill="#10b981" font-size="9" font-family="monospace" font-weight="700">NOTIFY</text>
    <text x="12" y="55" fill="#ffffff" font-size="13" font-weight="700">Telegram</text>
    <text x="12" y="75" fill="#38bdf8" font-size="10">Channel</text>
    <circle cx="50" cy="115" r="16" fill="#0088cc"/>
    <path d="M 43 115 L 56 108 L 52 122 Z" fill="#ffffff"/>
  </g>
</svg>
