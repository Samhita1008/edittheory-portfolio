<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background: #080a11; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="g6-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="g6-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fffb0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="g6-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#171b29" stroke-width="0.75"/>
    </pattern>
    <filter id="g6-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="680" fill="url(#g6-bg)"/>
  <rect width="1200" height="680" fill="url(#g6-grid)" opacity="0.6"/>

  <!-- Architecture Header Banner -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#4fffb0" font-size="11" font-family="monospace" letter-spacing="2" font-weight="600">AGENT 06 • FULL-STACK SYSTEM ARCHITECTURE</text>
    <text x="0" y="28" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">Edit Theory Concierge: Universal Booking Orchestrator</text>
    <text x="0" y="50" fill="#71717a" font-size="13">Client-Facing Interface ↔ Autonomous n8n Workflow ↔ CRM &amp; Multi-Channel Notification</text>
  </g>

  <!-- Flow Connector Lines -->
  <g stroke="#262b3d" stroke-width="2" fill="none">
    <!-- Main Pipeline Flow Line -->
    <path d="M 230 260 L 290 260" marker-end="url(#arrow)"/>
    <path d="M 520 260 L 580 260"/>
    <path d="M 810 260 L 870 260"/>
    
    <!-- Branching to Sheets -->
    <path d="M 405 340 L 405 440 L 460 440"/>
    <!-- Branching to Gmail -->
    <path d="M 695 340 L 695 440 L 740 440"/>
    <!-- Real-time Polling Feedback Loop -->
    <path d="M 985 340 L 985 540 L 145 540 L 145 340" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Stage 1: Client Frontend -->
  <g transform="translate(60, 180)">
    <rect width="170" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <rect x="1" y="1" width="168" height="3" fill="#4fffb0" rx="1.5"/>
    <text x="16" y="28" fill="#4fffb0" font-size="10" font-family="monospace" font-weight="700">NODE 01</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">React Frontend</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Tailwind CSS · Vite</text>
    <line x1="16" y1="80" x2="154" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• Natural language input</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Category venue picker</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Sub-second live polling</text>
  </g>

  <!-- Stage 2: Spatial Discovery & AI Parsing -->
  <g transform="translate(290, 180)">
    <rect width="230" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="700">NODE 02 • DISCOVERY</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">AI Location Resolver</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Groq Llama · OpenStreetMap</text>
    <line x1="16" y1="80" x2="214" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• Geo-spatial extraction</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Target radius filtering</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Enriched venue metadata</text>
  </g>

  <!-- Stage 3: Autonomous Booking Engine -->
  <g transform="translate(580, 180)">
    <rect width="230" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#4fffb0" font-size="10" font-family="monospace" font-weight="700">NODE 03 • CORE LOGIC</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">n8n Booking Engine</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Deterministic Validation Core</text>
    <line x1="16" y1="80" x2="214" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• Slot availability check</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• Atomic ID: #BK-7729</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Transaction state lock</text>
  </g>

  <!-- Stage 4: Multi-Channel Dispatch -->
  <g transform="translate(870, 180)">
    <rect width="230" height="160" rx="10" fill="#0f121e" stroke="#242b3e" stroke-width="1"/>
    <text x="16" y="28" fill="#a855f7" font-size="10" font-family="monospace" font-weight="700">NODE 04 • CONFIRMATION</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">Venue &amp; Client Dispatch</text>
    <text x="16" y="68" fill="#a1a1aa" font-size="11">Multi-Channel Communication</text>
    <line x1="16" y1="80" x2="214" y2="80" stroke="#1f2434" stroke-width="1"/>
    <text x="16" y="100" fill="#71717a" font-size="10" font-family="monospace">• Auto venue resolution</text>
    <text x="16" y="118" fill="#71717a" font-size="10" font-family="monospace">• WhatsApp / Twilio plug</text>
    <text x="16" y="136" fill="#71717a" font-size="10" font-family="monospace">• Calendar .ics generation</text>
  </g>

  <!-- Secondary Storage: Google Sheets -->
  <g transform="translate(460, 390)">
    <rect width="210" height="100" rx="8" fill="#0a0d16" stroke="#1e2436" stroke-width="1"/>
    <text x="16" y="26" fill="#10b981" font-size="10" font-family="monospace" font-weight="700">CRM STATE STORE</text>
    <text x="16" y="46" fill="#ffffff" font-size="13" font-weight="600">Google Sheets CRM API</text>
    <text x="16" y="68" fill="#71717a" font-size="10" font-family="monospace">Row-append with atomic lock</text>
    <text x="16" y="84" fill="#52525b" font-size="9" font-family="monospace">Zero-race condition schema</text>
  </g>

  <!-- Secondary Service: Gmail API -->
  <g transform="translate(740, 390)">
    <rect width="210" height="100" rx="8" fill="#0a0d16" stroke="#1e2436" stroke-width="1"/>
    <text x="16" y="26" fill="#ef4444" font-size="10" font-family="monospace" font-weight="700">NOTIFY ENGINE</text>
    <text x="16" y="46" fill="#ffffff" font-size="13" font-weight="600">Gmail API Dispatcher</text>
    <text x="16" y="68" fill="#71717a" font-size="10" font-family="monospace">Itinerary &amp; direction guide</text>
    <text x="16" y="84" fill="#52525b" font-size="9" font-family="monospace">Instant customer delivery</text>
  </g>

  <!-- Realtime Polling Badge on Feedback Line -->
  <g transform="translate(490, 525)">
    <rect width="220" height="30" rx="6" fill="#070910" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
    <text x="28" y="19" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="600">Real-time status polling: 2.5s</text>
  </g>
</svg>
