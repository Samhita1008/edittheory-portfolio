<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background: #090b12; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <rect width="1000" height="600" fill="#090b12"/>
  
  <!-- Browser / System Window Chrome -->
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0e111a" stroke="#22283a" stroke-width="1"/>
  <circle cx="68" cy="64" r="5" fill="#ef4444"/>
  <circle cx="86" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="104" cy="64" r="5" fill="#10b981"/>
  <text x="500" y="68" fill="#71717a" font-size="11" font-family="monospace" text-anchor="middle">EDIT THEORY CONCIERGE • RESERVATION CONFIRMATION #BK-7729</text>

  <!-- Left: Confirmation Card -->
  <g transform="translate(80, 110)">
    <rect width="450" height="410" rx="10" fill="#121624" stroke="#252c40" stroke-width="1"/>
    
    <g transform="translate(24, 24)">
      <text x="0" y="16" fill="#4fffb0" font-size="11" font-family="monospace" letter-spacing="1">STATUS: CONFIRMED</text>
      <text x="0" y="44" fill="#ffffff" font-size="20" font-weight="700">Equinox Soho Club</text>
      <text x="0" y="66" fill="#a1a1aa" font-size="12">568 Broadway, New York, NY 10012</text>
      
      <line x1="0" y1="84" x2="400" y2="84" stroke="#1f2638" stroke-width="1"/>
      
      <g transform="translate(0, 105)">
        <text x="0" y="0" fill="#71717a" font-size="10" font-family="monospace">DATE &amp; TIME</text>
        <text x="0" y="20" fill="#ffffff" font-size="14" font-weight="600">Friday, Oct 24 • 18:30 EST</text>
      </g>
      <g transform="translate(220, 105)">
        <text x="0" y="0" fill="#71717a" font-size="10" font-family="monospace">GUESTS</text>
        <text x="0" y="20" fill="#ffffff" font-size="14" font-weight="600">2 Attendees (Guest Pass)</text>
      </g>
      
      <g transform="translate(0, 165)">
        <text x="0" y="0" fill="#71717a" font-size="10" font-family="monospace">SESSION TYPE</text>
        <text x="0" y="20" fill="#ffffff" font-size="14" font-weight="600">Private Studio Training</text>
      </g>
      <g transform="translate(220, 165)">
        <text x="0" y="0" fill="#71717a" font-size="10" font-family="monospace">LOCK TRANSACTION</text>
        <text x="0" y="20" fill="#4fffb0" font-size="14" font-family="monospace" font-weight="600">#BK-7729-AUTH</text>
      </g>

      <line x1="0" y1="210" x2="400" y2="210" stroke="#1f2638" stroke-width="1"/>
      
      <text x="0" y="235" fill="#a1a1aa" font-size="11" font-family="monospace">AUTOMATED CRM STATE:</text>
      <text x="0" y="255" fill="#71717a" font-size="11" font-family="monospace">→ Appended to Google Sheets CRM (Row 412)</text>
      <text x="0" y="275" fill="#71717a" font-size="11" font-family="monospace">→ Dispatched Gmail itinerary (.ics calendar attached)</text>
      <text x="0" y="295" fill="#71717a" font-size="11" font-family="monospace">→ Instant client state synchronization verified</text>

      <rect x="0" y="320" width="160" height="34" rx="6" fill="#4fffb0" opacity="0.9"/>
      <text x="80" y="342" fill="#090b12" font-size="11" font-weight="700" text-anchor="middle">VIEW CALENDAR (.ICS)</text>
    </g>
  </g>

  <!-- Right: Dispatch Log -->
  <g transform="translate(560, 110)">
    <rect width="360" height="410" rx="10" fill="#0b0e17" stroke="#1f2434" stroke-width="1"/>
    <g transform="translate(20, 24)">
      <text x="0" y="16" fill="#a1a1aa" font-size="11" font-family="monospace">DISPATCH LOG &amp; PAYLOAD</text>
      <line x1="0" y1="30" x2="320" y2="30" stroke="#1a2030" stroke-width="1"/>
      
      <text x="0" y="60" fill="#38bdf8" font-size="10" font-family="monospace">200 OK • POST /api/book-session</text>
      <text x="0" y="80" fill="#71717a" font-size="10" font-family="monospace">{"status": "CONFIRMED",</text>
      <text x="10" y="100" fill="#71717a" font-size="10" font-family="monospace"> "bookingId": "BK-7729",</text>
      <text x="10" y="120" fill="#71717a" font-size="10" font-family="monospace"> "venue": "Equinox Soho Club",</text>
      <text x="10" y="140" fill="#71717a" font-size="10" font-family="monospace"> "slot": "2026-10-24T18:30:00Z",</text>
      <text x="10" y="160" fill="#71717a" font-size="10" font-family="monospace"> "customerEmail": "alex@example.com",</text>
      <text x="10" y="180" fill="#71717a" font-size="10" font-family="monospace"> "sheetsRow": 412,</text>
      <text x="10" y="200" fill="#71717a" font-size="10" font-family="monospace"> "emailSent": true,</text>
      <text x="10" y="220" fill="#71717a" font-size="10" font-family="monospace"> "executionTimeMs": 680}</text>

      <line x1="0" y1="240" x2="320" y2="240" stroke="#1a2030" stroke-width="1"/>
      <text x="0" y="265" fill="#4fffb0" font-size="11" font-family="monospace">VERIFIED PIPELINE EXECUTION</text>
      <text x="0" y="285" fill="#71717a" font-size="10">Sub-second transaction latency</text>
      <text x="0" y="305" fill="#71717a" font-size="10">Deterministic state persistence</text>
    </g>
  </g>
</svg>
