<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background: #090b12; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <rect width="1000" height="600" fill="#090b12"/>
  
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0e111a" stroke="#22283a" stroke-width="1"/>
  <circle cx="68" cy="64" r="5" fill="#ef4444"/>
  <circle cx="86" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="104" cy="64" r="5" fill="#10b981"/>
  <text x="500" y="68" fill="#71717a" font-size="11" font-family="monospace" text-anchor="middle">EMAIL SUMMARY AGENT • REAL-TIME TELEGRAM DIGEST STREAM</text>

  <!-- Mobile Telegram Digest Mockup Center-Left -->
  <g transform="translate(140, 105)">
    <rect width="360" height="420" rx="20" fill="#181f2f" stroke="#2a334d" stroke-width="1.5"/>
    
    <!-- Telegram Header -->
    <rect width="360" height="50" rx="20" fill="#1d263a"/>
    <circle cx="30" cy="25" r="14" fill="#0088cc"/>
    <text x="54" y="22" fill="#ffffff" font-size="13" font-weight="600">Edit Theory Triage Bot</text>
    <text x="54" y="37" fill="#38bdf8" font-size="10">bot • continuous polling active</text>

    <!-- Message Bubble 1: Priority Alert -->
    <g transform="translate(20, 70)">
      <rect width="320" height="150" rx="12" fill="#212c42" stroke="#2f3d5c" stroke-width="1"/>
      <g transform="translate(16, 16)">
        <text x="0" y="0" fill="#ef4444" font-size="10" font-family="monospace" font-weight="700">🔴 HIGH PRIORITY • CONTRACT DEADLINE</text>
        <text x="0" y="22" fill="#ffffff" font-size="12" font-weight="600">From: Sarah Lin &lt;sarah@solaris.vc&gt;</text>
        <text x="0" y="40" fill="#cbd5e1" font-size="11">Subj: Revised Term Sheet &amp; Closing Date</text>
        <line x1="0" y1="52" x2="288" y2="52" stroke="#2d3b59" stroke-width="1"/>
        <text x="0" y="70" fill="#94a3b8" font-size="10" font-family="monospace">CORE ACTION ITEM:</text>
        <text x="0" y="88" fill="#ffffff" font-size="11">Sign revised appendix 4 before 5:00 PM EST today.</text>
        <text x="0" y="106" fill="#38bdf8" font-size="10" font-family="monospace">Inference: Groq LLM (320ms latency)</text>
      </g>
    </g>

    <!-- Message Bubble 2: Medium Alert -->
    <g transform="translate(20, 240)">
      <rect width="320" height="140" rx="12" fill="#212c42" stroke="#2f3d5c" stroke-width="1"/>
      <g transform="translate(16, 16)">
        <text x="0" y="0" fill="#f59e0b" font-size="10" font-family="monospace" font-weight="700">🟡 MEDIUM PRIORITY • COLLABORATION</text>
        <text x="0" y="22" fill="#ffffff" font-size="12" font-weight="600">From: Marcus Vance &lt;m.vance@studio.design&gt;</text>
        <text x="0" y="40" fill="#cbd5e1" font-size="11">Subj: Brand Asset Delivery</text>
        <line x1="0" y1="52" x2="288" y2="52" stroke="#2d3b59" stroke-width="1"/>
        <text x="0" y="70" fill="#94a3b8" font-size="10" font-family="monospace">CORE ACTION ITEM:</text>
        <text x="0" y="88" fill="#ffffff" font-size="11">Review Figma export links for client workshop.</text>
      </g>
    </g>
  </g>

  <!-- Right: Metrics & Daemon Status -->
  <g transform="translate(540, 105)">
    <rect width="360" height="420" rx="10" fill="#0b0e17" stroke="#1f2434" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <text x="0" y="16" fill="#a1a1aa" font-size="11" font-family="monospace">DAEMON EXECUTION METRICS</text>
      <line x1="0" y1="30" x2="310" y2="30" stroke="#1a2030" stroke-width="1"/>
      
      <text x="0" y="60" fill="#ffffff" font-size="13" font-weight="600">Continuous 24h Telemetry</text>
      <text x="0" y="85" fill="#71717a" font-size="11" font-family="monospace">• Polling Interval: Every 60 seconds</text>
      <text x="0" y="110" fill="#71717a" font-size="11" font-family="monospace">• Noise Filter Rate: 84% newsletters blocked</text>
      <text x="0" y="135" fill="#71717a" font-size="11" font-family="monospace">• Avg Action Extraction Time: 340ms</text>
      <text x="0" y="160" fill="#71717a" font-size="11" font-family="monospace">• Zero missed urgent messages</text>

      <line x1="0" y1="190" x2="310" y2="190" stroke="#1a2030" stroke-width="1"/>
      <text x="0" y="220" fill="#4fffb0" font-size="11" font-family="monospace">OAUTH REFRESH INTEGRITY</text>
      <text x="0" y="245" fill="#71717a" font-size="10">Automated token refresh cycle keeps daemon alive</text>
      <text x="0" y="265" fill="#71717a" font-size="10">without re-prompting user logins.</text>
    </g>
  </g>
</svg>
